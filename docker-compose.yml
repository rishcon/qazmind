services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/qazmind.db
      SECRET_KEY: ${SECRET_KEY:-change-this-before-public-deployment}
      CORS_ORIGINS: '["http://localhost:8081","http://127.0.0.1:8081"]'
    volumes:
      - qazmind-data:/app/data
      - ./backend/static/podcasts:/app/static/podcasts
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qazmind-data:
